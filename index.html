<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>犯罪組織關聯圖產生器 (賽博龐克風)</title>
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 Google Fonts (科技感字體) -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  
  <!-- 引入 React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 引入 Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- 引入 html2canvas 用於截圖功能 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* 賽博龐克 HUD 風格 CSS */
    body {
      background-color: #050b14;
      font-family: 'Noto Sans TC', sans-serif;
    }

    .font-cyber {
      font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
    }

    /* 科技網格背景 */
    .cyber-bg {
      background-color: #070e1a;
      background-image: 
        linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px),
        radial-gradient(circle at center, rgba(0,243,255,0.1) 0%, transparent 60%);
      background-size: 30px 30px, 30px 30px, 100% 100%;
      position: relative;
    }

    /* HUD 群組外框 */
    .hud-container {
      position: relative;
      background: rgba(4, 15, 30, 0.6);
      border: 1px solid rgba(0, 243, 255, 0.2);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.05) inset;
      backdrop-filter: blur(4px);
    }
    
    /* HUD 裝飾角 (四個角落的框線) */
    .hud-corner {
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: rgba(0, 243, 255, 0.8);
      border-style: solid;
      border-width: 0;
    }
    .hud-corner-tl { top: -1px; left: -1px; border-top-width: 3px; border-left-width: 3px; }
    .hud-corner-tr { top: -1px; right: -1px; border-top-width: 3px; border-right-width: 3px; }
    .hud-corner-bl { bottom: -1px; left: -1px; border-bottom-width: 3px; border-left-width: 3px; }
    .hud-corner-br { bottom: -1px; right: -1px; border-bottom-width: 3px; border-right-width: 3px; }

    /* 節點卡片樣式 */
    .cyber-node {
      position: relative;
      background: linear-gradient(135deg, rgba(10, 25, 45, 0.9) 0%, rgba(2, 6, 12, 0.9) 100%);
      border: 1px solid;
    }

    /* 主嫌 (霓虹紅/粉) */
    .node-red {
      border-color: #ff0055;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.3), inset 0 0 10px rgba(255, 0, 85, 0.2);
    }
    .node-red .icon-container { background: rgba(255, 0, 85, 0.15); border: 1px solid #ff0055; color: #ff0055; }
    .text-glow-red { color: #ff0055; text-shadow: 0 0 8px rgba(255, 0, 85, 0.6); }

    /* 共犯 (霓虹黃/橘) */
    .node-yellow {
      border-color: #f59e0b;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.3), inset 0 0 10px rgba(245, 158, 11, 0.2);
    }
    .node-yellow .icon-container { background: rgba(245, 158, 11, 0.15); border: 1px solid #f59e0b; color: #f59e0b; }
    .text-glow-yellow { color: #f59e0b; text-shadow: 0 0 8px rgba(245, 158, 11, 0.6); }

    /* 第三群組 (霓虹青/藍) */
    .node-blue {
      border-color: #00f3ff;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3), inset 0 0 10px rgba(0, 243, 255, 0.2);
    }
    .node-blue .icon-container { background: rgba(0, 243, 255, 0.15); border: 1px solid #00f3ff; color: #00f3ff; }
    .text-glow-blue { color: #00f3ff; text-shadow: 0 0 8px rgba(0, 243, 255, 0.6); }

    /* 通用文字發光 */
    .text-glow-white {
      color: #e2e8f0;
      text-shadow: 0 0 4px rgba(255, 255, 255, 0.5);
    }
    
    .status-missing {
      color: #ff0055;
      animation: pulse-red 2s infinite;
    }
    .status-normal {
      color: #10b981;
      text-shadow: 0 0 5px rgba(16, 185, 129, 0.6);
    }

    @keyframes pulse-red {
      0% { text-shadow: 0 0 5px #ff0055; }
      50% { text-shadow: 0 0 15px #ff0055, 0 0 20px #ff0055; }
      100% { text-shadow: 0 0 5px #ff0055; }
    }

    /* 捲軸美化 */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #050b14; }
    ::-webkit-scrollbar-thumb { background: #00f3ff50; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #00f3ff80; }
  </style>
</head>
<body class="bg-[#050b14] text-slate-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // --- 科技感 Icons ---
    const UserMaleIcon = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" className="w-full h-full"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
    );
    const UserFemaleIcon = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" className="w-full h-full"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle><line x1="12" y1="11" x2="12" y2="14"></line></svg>
    );
    const EditIcon = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
    );
    const ViewIcon = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
    );
    const DownloadIcon = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
    );

    // --- Initial Data ---
    const initialData = {
      title: "某某組織犯罪關聯圖",
      thirdGroupName: "藥角",
      showAccomplices: true, 
      showThirdGroup: true,  
      suspects: [
        { id: 's1', name: '主嫌A', role: '首腦', details: '負責統籌與資金', status: '在逃', isMissing: true, gender: 'male' }
      ],
      accomplices: [
        { id: 'a1', name: '共犯B', role: '車手頭', details: '指揮車手提款', status: '羈押', isMissing: false, gender: 'male' },
        { id: 'a2', name: '共犯C', role: '會計', details: '負責記帳與分潤', status: '交保', isMissing: false, gender: 'female' }
      ],
      thirdGroup: [
        { id: 't1', name: '藥角D', role: '下游', details: '負責末端販售', status: '', isMissing: false, gender: 'male' },
        { id: 't2', name: '藥角E', role: '下游', details: '負責末端販售', status: '', isMissing: false, gender: 'female' },
        { id: 't3', name: '藥角F', role: '下游', details: '', status: '失聯', isMissing: true, gender: 'male' }
      ]
    };

    // --- Components ---
    const NodeCard = ({ data, themeClass }) => (
      <div id={data.id} className={`cyber-node ${themeClass} flex flex-col items-center p-3 w-[120px] md:w-36 shrink-0 transition-all hover:scale-105 z-10`}>
        {/* 小小的HUD角標裝飾 */}
        <div className="absolute top-0 left-0 w-2 h-2 border-t border-l border-current opacity-50"></div>
        <div className="absolute bottom-0 right-0 w-2 h-2 border-b border-r border-current opacity-50"></div>
        
        <div className={`icon-container p-2 mb-2 w-10 h-10 md:w-12 md:h-12 flex items-center justify-center rounded-sm`}>
          {data.gender === 'male' ? <UserMaleIcon /> : <UserFemaleIcon />}
        </div>
        
        <div className="text-center font-bold text-sm md:text-base mb-1 leading-tight text-glow-white break-words w-full font-cyber">
          {data.name}
        </div>
        {data.role && <div className="text-center text-xs font-semibold mb-1 opacity-70">[{data.role}]</div>}
        
        {data.details && (
          <div className="text-center text-[10px] md:text-[11px] text-slate-400 whitespace-pre-line leading-tight mb-2 opacity-80">
            {data.details}
          </div>
        )}
        
        {data.status && (
          <div className={`text-center text-xs md:text-sm font-bold mt-auto pt-2 w-full border-t border-slate-700/50 ${data.isMissing ? 'status-missing' : 'status-normal'}`}>
            {data.isMissing ? `[ ${data.status} ]` : data.status}
          </div>
        )}
      </div>
    );

    function App() {
      const [data, setData] = useState(initialData);
      const [editMode, setEditMode] = useState(true);
      const [isDownloading, setIsDownloading] = useState(false);
      const [previewImage, setPreviewImage] = useState(null); // 用於儲存 iOS 預覽圖片
      const canvasRef = useRef(null);
      const [lines, setLines] = useState([]);

      // 計算科技連線
      const calculateLines = useCallback(() => {
        if (!canvasRef.current || (editMode === false && document.hidden)) return;
        
        const canvasRect = canvasRef.current.getBoundingClientRect();
        const getEdge = (id, edge) => {
          const el = document.getElementById(id);
          if (!el) return null;
          const rect = el.getBoundingClientRect();
          let x = rect.left - canvasRect.left + rect.width / 2;
          let y = rect.top - canvasRect.top + rect.height / 2;
          
          if (edge === 'bottom') y = rect.bottom - canvasRect.top;
          if (edge === 'top') y = rect.top - canvasRect.top;
          return { x, y };
        }

        const newLines = [];
        
        // 動態收集目前「有顯示」的群組節點 ID
        const visibleGroups = ['group-suspects'];
        if (data.showAccomplices) visibleGroups.push('group-accomplices');
        if (data.showThirdGroup) visibleGroups.push('group-third');

        // 依序將顯示的群組由上到下連起來 (若中間群組被隱藏，線條會自動跨接)
        for (let i = 0; i < visibleGroups.length - 1; i++) {
          const topNodeId = visibleGroups[i];
          const bottomNodeId = visibleGroups[i + 1];
          const topEdge = getEdge(topNodeId, 'bottom');
          const bottomEdge = getEdge(bottomNodeId, 'top');
          
          if (topEdge && bottomEdge) {
             newLines.push({ d: `M ${topEdge.x} ${topEdge.y} L ${bottomEdge.x} ${bottomEdge.y}` });
          }
        }

        setLines(newLines);
      }, [data, editMode]);

      useEffect(() => {
        const timer = setTimeout(calculateLines, 150);
        window.addEventListener('resize', calculateLines);
        return () => {
          clearTimeout(timer);
          window.removeEventListener('resize', calculateLines);
        };
      }, [calculateLines]);

      const handleToggleLayer = (layerKey) => {
        if (data[layerKey]) {
          if (!confirm('確認刪除/隱藏此階層？隱藏後資料不會遺失，可隨時恢復。')) return;
        }
        setData(prev => ({ ...prev, [layerKey]: !prev[layerKey] }));
      };

      const handleTitleChange = (e) => setData(prev => ({ ...prev, title: e.target.value }));
      
      const handleNodeChange = (category, index, field, value) => {
        setData(prev => {
          const newArray = [...prev[category]];
          newArray[index] = { ...newArray[index], [field]: value };
          return { ...prev, [category]: newArray };
        });
      };

      const handleAddNode = (category) => {
        const newId = Date.now().toString() + Math.floor(Math.random() * 1000);
        const newNode = { id: `${category}-${newId}`, name: 'NEW_TARGET', role: '', details: '', status: '', isMissing: false, gender: 'male' };
        setData(prev => ({
          ...prev,
          [category]: [...prev[category], newNode]
        }));
      };

      const handleRemoveNode = (category, index) => {
        if (confirm('確認從系統中刪除此目標？')) {
          setData(prev => {
            const newArray = [...prev[category]];
            newArray.splice(index, 1);
            return { ...prev, [category]: newArray };
          });
        }
      };

      const handleDownload = async () => {
        if (!canvasRef.current) return;
        setIsDownloading(true);
        try {
          await new Promise(resolve => setTimeout(resolve, 200)); 
          
          const canvas = await html2canvas(canvasRef.current, {
            scale: 2, 
            backgroundColor: '#070e1a', 
            useCORS: true, 
            allowTaint: true
          });
          
          const image = canvas.toDataURL("image/png");
          
          // 偵測是否為 Apple 裝置 (iOS Safari 安全限制阻擋直接下載)
          const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          
          if (isIOS) {
             // 蘋果手機改採開啟全螢幕視窗，讓使用者自行長按圖片儲存
             setPreviewImage(image);
          } else {
             // Android 或電腦版則直接觸發下載
             const link = document.createElement('a');
             link.href = image;
             link.download = `[SYS_${data.title || '犯罪關聯圖'}]_HUD.png`; 
             link.click();
          }

        } catch (err) {
          console.error("截圖失敗:", err);
          alert("系統異常：截圖產生失敗！");
        } finally {
          setIsDownloading(false);
        }
      };

      // 編輯面板
      const renderFormInput = (label, value, onChange, type="text") => (
        <div className="mb-3">
          <label className="block text-xs font-cyber text-cyan-400 mb-1">{label}</label>
          {type === 'textarea' ? (
            <textarea className="w-full border border-slate-600 rounded p-2 text-sm bg-slate-800 text-white focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 outline-none transition" rows="2" value={value} onChange={onChange} />
          ) : (
            <input type={type} className="w-full border border-slate-600 rounded p-2 text-sm bg-slate-800 text-white focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 outline-none transition" value={value} onChange={onChange} />
          )}
        </div>
      );

      const renderNodeEditor = (node, category, index) => (
        <div key={node.id} className="bg-slate-800/80 p-4 border border-slate-700 mb-4 relative group">
          <button 
            onClick={() => handleRemoveNode(category, index)} 
            className="absolute top-2 right-2 text-rose-400 hover:text-white hover:bg-rose-600 text-xs font-bold px-2 py-1 bg-slate-900 border border-rose-500/50 rounded opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-all"
          >
            DEL
          </button>
          
          <div className="font-bold text-xs mb-3 text-slate-300 border-b border-slate-600 pb-2 pr-12 flex items-center gap-2 font-cyber tracking-widest">
            <span className="w-1.5 h-4 bg-cyan-500 inline-block"></span>
            TARGET: {node.name || 'UNKNOWN'}
          </div>
          
          <div className="flex flex-col md:flex-row gap-0 md:gap-3">
             <div className="flex-1">
               {renderFormInput("姓名/代號", node.name, (e) => handleNodeChange(category, index, 'name', e.target.value))}
             </div>
             <div className="w-full md:w-20 mb-3 md:mb-0">
               <label className="block text-xs font-cyber text-cyan-400 mb-1">性別</label>
               <select className="w-full border border-slate-600 rounded p-2 text-sm bg-slate-800 text-white focus:border-cyan-400 outline-none" value={node.gender} onChange={(e) => handleNodeChange(category, index, 'gender', e.target.value)}>
                  <option value="male">男</option>
                  <option value="female">女</option>
               </select>
             </div>
          </div>
          
          <div className="grid grid-cols-1 md:grid-cols-2 gap-0 md:gap-3">
            {renderFormInput("角色/身分", node.role, (e) => handleNodeChange(category, index, 'role', e.target.value))}
            {renderFormInput("當前狀態 (在逃/羈押)", node.status, (e) => handleNodeChange(category, index, 'status', e.target.value))}
          </div>
          
          {renderFormInput("情資細節", node.details, (e) => handleNodeChange(category, index, 'details', e.target.value), 'textarea')}
          
          <div className="flex items-center justify-end mt-2 pt-2 border-t border-slate-700">
             <label className="flex items-center text-xs font-bold text-rose-400 cursor-pointer bg-rose-950/30 px-3 py-1.5 rounded border border-rose-900/50 hover:bg-rose-900/50 transition">
               <input type="checkbox" checked={node.isMissing || false} onChange={(e) => handleNodeChange(category, index, 'isMissing', e.target.checked)} className="mr-2 accent-rose-500" />
               標記危險/失聯 (紅字)
             </label>
          </div>
        </div>
      );

      return (
        <div className="flex h-[100dvh] w-full bg-[#050b14] overflow-hidden relative">
          
          {/* --- iOS 下載預覽彈窗 (蘋果手機專用) --- */}
          {previewImage && (
            <div className="fixed inset-0 z-[100] bg-[#050b14]/95 backdrop-blur-md flex flex-col items-center justify-center p-4 md:p-10">
               <div className="bg-[#0a111f] border border-cyan-500/50 p-4 md:p-6 rounded-xl shadow-[0_0_30px_rgba(0,243,255,0.2)] max-w-full w-full max-h-full flex flex-col items-center relative">
                 <p className="text-cyan-400 font-cyber mb-4 text-center text-sm md:text-base tracking-widest leading-relaxed">
                   [ 系統提示 : iOS 安全限制 ]<br/>
                   請<strong className="text-rose-400 text-lg mx-1 animate-pulse">長按下方圖片</strong>並選擇「儲存影像」
                 </p>
                 
                 <div className="overflow-auto w-full border border-slate-700 rounded bg-black flex-1 shadow-inner">
                   <img src={previewImage} alt="HUD_Preview" className="w-full h-auto object-contain" />
                 </div>
                 
                 <button 
                   onClick={() => setPreviewImage(null)}
                   className="mt-6 bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-cyan-500/50 px-8 py-3 rounded font-cyber tracking-widest active:scale-95 transition-all shadow-[0_0_10px_rgba(0,243,255,0.2)]"
                 >
                   CLOSE // 關閉視窗
                 </button>
               </div>
            </div>
          )}

          {/* --- Sidebar Editor --- */}
          <div className={`${editMode ? 'flex' : 'hidden'} md:flex fixed inset-0 z-50 md:static flex-col w-full md:w-[400px] bg-[#0a111f] border-r border-slate-800 shadow-2xl h-full overflow-y-auto shrink-0 transition-all`}>
            
            <div className="p-4 bg-[#060c17] text-cyan-400 border-b border-cyan-500/30 sticky top-0 z-30 flex justify-between items-center shadow-lg font-cyber">
              <h2 className="font-bold text-sm tracking-[0.2em] flex items-center gap-2">
                <span className="w-2 h-2 bg-cyan-400 animate-pulse"></span>
                SYSTEM.CONTROL
              </h2>
              
              <button onClick={() => setEditMode(false)} className="md:hidden bg-cyan-600/20 hover:bg-cyan-600/40 border border-cyan-500 text-cyan-300 px-3 py-1.5 rounded text-xs flex items-center gap-1 transition">
                <ViewIcon /> 預覽 HUD
              </button>
              <button onClick={() => setEditMode(false)} className="hidden md:block text-[10px] text-slate-400 hover:text-cyan-300 px-2 py-1 border border-slate-700 hover:border-cyan-500/50 rounded transition tracking-wider">
                HIDE_PANEL
              </button>
            </div>
            
            <div className="p-4 space-y-6 pb-24 md:pb-8">
              <div className="bg-slate-800/50 p-4 border border-slate-700 relative">
                <div className="absolute top-0 left-0 w-2 h-2 border-t border-l border-cyan-500"></div>
                <h3 className="font-cyber text-xs text-slate-400 mb-3 border-b border-slate-700 pb-1 tracking-wider">PROJECT.TITLE</h3>
                {renderFormInput("HUD 主標題", data.title, handleTitleChange)}
              </div>

              {/* Suspects */}
              <div>
                <div className="flex justify-between items-center mb-3 bg-rose-950/20 p-2 border border-rose-500/30">
                   <h3 className="font-cyber font-bold text-rose-500 text-sm tracking-wider">CLASS: ALPHA (主嫌)</h3>
                   <button onClick={() => handleAddNode('suspects')} className="bg-rose-600/20 text-rose-400 text-xs px-2 py-1 hover:bg-rose-600/40 border border-rose-500/50 transition tracking-widest">+ ADD</button>
                </div>
                {data.suspects.map((node, i) => renderNodeEditor(node, 'suspects', i))}
              </div>

              {/* Accomplices */}
              {data.showAccomplices ? (
                <div>
                  <div className="flex justify-between items-center mb-3 bg-amber-950/20 p-2 border border-amber-500/30">
                     <h3 className="font-cyber font-bold text-amber-500 text-sm tracking-wider">CLASS: BETA (共犯)</h3>
                     <div className="flex gap-2">
                       <button onClick={() => handleToggleLayer('showAccomplices')} className="bg-rose-900/30 text-rose-400 text-[10px] px-2 py-1 hover:bg-rose-800/60 border border-rose-500/50 transition tracking-widest" title="刪除此階層">DEL_CLS</button>
                       <button onClick={() => handleAddNode('accomplices')} className="bg-amber-600/20 text-amber-400 text-xs px-2 py-1 hover:bg-amber-600/40 border border-amber-500/50 transition tracking-widest">+ ADD</button>
                     </div>
                  </div>
                  {data.accomplices.map((node, i) => renderNodeEditor(node, 'accomplices', i))}
                  {data.accomplices.length === 0 && <div className="text-xs text-slate-500 text-center py-2">NO DATA.</div>}
                </div>
              ) : (
                <button onClick={() => handleToggleLayer('showAccomplices')} className="w-full bg-amber-950/20 text-amber-500 border border-amber-500/30 border-dashed p-3 text-xs font-cyber tracking-widest hover:bg-amber-900/40 transition">
                  + RESTORE CLASS: BETA (新增共犯階層)
                </button>
              )}

              {/* Third Group */}
              {data.showThirdGroup ? (
                <div>
                  <div className="flex justify-between items-center mb-3 bg-cyan-950/20 p-2 border border-cyan-500/30">
                     <div className="flex items-center gap-1 font-cyber font-bold text-cyan-400 text-sm tracking-wider">
                       <span>CLASS:</span>
                       <input 
                          type="text" 
                          className="bg-transparent border-b border-dashed border-cyan-500/50 focus:border-cyan-400 focus:bg-cyan-950/30 outline-none w-20 px-1 py-0.5 uppercase" 
                          value={data.thirdGroupName}
                          onChange={(e) => setData(prev => ({...prev, thirdGroupName: e.target.value}))}
                       />
                     </div>
                     <div className="flex gap-2">
                       <button onClick={() => handleToggleLayer('showThirdGroup')} className="bg-rose-900/30 text-rose-400 text-[10px] px-2 py-1 hover:bg-rose-800/60 border border-rose-500/50 transition tracking-widest" title="刪除此階層">DEL_CLS</button>
                       <button onClick={() => handleAddNode('thirdGroup')} className="bg-cyan-600/20 text-cyan-400 text-xs px-2 py-1 hover:bg-cyan-600/40 border border-cyan-500/50 transition tracking-widest">+ ADD</button>
                     </div>
                  </div>
                  {data.thirdGroup.map((node, i) => renderNodeEditor(node, 'thirdGroup', i))}
                  {data.thirdGroup.length === 0 && <div className="text-xs text-slate-500 text-center py-2">NO DATA.</div>}
                </div>
              ) : (
                <button onClick={() => handleToggleLayer('showThirdGroup')} className="w-full bg-cyan-950/20 text-cyan-500 border border-cyan-500/30 border-dashed p-3 text-xs font-cyber tracking-widest hover:bg-cyan-900/40 transition">
                  + RESTORE CLASS: {data.thirdGroupName ? data.thirdGroupName.toUpperCase() : 'GAMMA'} (新增自訂階層)
                </button>
              )}
            </div>
          </div>

          {/* --- Main Canvas (Cyberpunk HUD 區) --- */}
          <div className="flex-1 h-full overflow-auto cyber-bg relative p-4 md:p-8 w-full scroll-smooth">
            
            {/* 懸浮按鈕 */}
            {!editMode && (
              <div className="fixed bottom-6 right-6 md:absolute md:top-6 md:left-6 md:bottom-auto md:right-auto z-50 flex flex-col md:flex-row gap-3">
                <button 
                  onClick={() => setEditMode(true)} 
                  className="bg-slate-900/80 backdrop-blur text-cyan-400 p-3 md:px-4 md:py-2 rounded-sm shadow-[0_0_15px_rgba(0,243,255,0.2)] hover:bg-slate-800 hover:text-cyan-300 active:scale-95 transition-all flex items-center justify-center border border-cyan-500/50 gap-2 font-cyber text-sm tracking-widest"
                >
                  <EditIcon className="md:hidden" />
                  <span className="hidden md:inline">SYSTEM.EDIT</span>
                </button>
                
                <button 
                  onClick={handleDownload}
                  disabled={isDownloading}
                  className={`${isDownloading ? 'bg-slate-800 text-slate-500 border-slate-600' : 'bg-cyan-900/40 text-cyan-300 border-cyan-400 hover:bg-cyan-800/60 shadow-[0_0_15px_rgba(0,243,255,0.4)]'} backdrop-blur p-3 md:px-4 md:py-2 rounded-sm active:scale-95 transition-all flex items-center justify-center border gap-2 font-cyber text-sm tracking-widest`}
                >
                  <DownloadIcon className="md:hidden" />
                  <span className="hidden md:inline">{isDownloading ? 'PROCESSING...' : 'EXPORT.HUD'}</span>
                </button>
              </div>
            )}

            {/* HUD 畫布容器 */}
            <div 
              ref={canvasRef}
              className="min-w-[750px] md:min-w-[1000px] max-w-[1400px] mx-auto min-h-[600px] md:min-h-[800px] relative p-6 md:p-10 flex flex-col items-center overflow-hidden" 
            >
              
              {/* 背景圖：偵防分署徽章 (30%透明度) */}
              <div className="absolute inset-0 flex items-center justify-center pointer-events-none opacity-30 z-0">
                 {/* 在同資料夾下讀取使用者上傳的圖片 */}
                 <img src="偵防分署徽-大.PNG" alt="Logo" className="w-[80%] max-w-[600px] object-contain drop-shadow-[0_0_20px_rgba(255,255,255,0.3)]" />
              </div>

              {/* 掃描線特效 (僅在網頁觀看時有效果) */}
              <div className="absolute top-0 left-0 w-full h-1 bg-cyan-400/20 blur-[2px] z-20 pointer-events-none animate-[scan_3s_linear_infinite]"></div>
              <style>{`@keyframes scan { 0% { top: 0; } 100% { top: 100%; } }`}</style>

              {/* 標題 (發光科技字) */}
              <div className="text-center py-4 px-10 md:px-16 mb-12 md:mb-16 mx-auto w-max hud-container relative z-10">
                <div className="hud-corner hud-corner-tl"></div>
                <div className="hud-corner hud-corner-tr"></div>
                <div className="hud-corner hud-corner-bl"></div>
                <div className="hud-corner hud-corner-br"></div>
                <div className="absolute -top-3 left-1/2 transform -translate-x-1/2 bg-[#050b14] px-2 text-[10px] text-cyan-500 font-cyber tracking-widest">DISPLAY // TARGET_MAP</div>
                <h1 className="text-2xl md:text-4xl font-black tracking-widest text-glow-white">{data.title}</h1>
              </div>

              {/* 發光科技連線 */}
              <svg className="absolute top-0 left-0 w-full h-full pointer-events-none z-0">
                <defs>
                  <marker id="arrow-cyber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#00f3ff" />
                  </marker>
                </defs>
                {lines.map((line, idx) => (
                  <path
                    key={idx}
                    d={line.d}
                    fill="none"
                    stroke="#00f3ff"
                    strokeWidth="3"
                    markerEnd="url(#arrow-cyber)"
                    className="opacity-90"
                    style={{ filter: 'drop-shadow(0 0 6px #00f3ff)' }}
                  />
                ))}
              </svg>

              {/* 組織階層區塊 */}
              <div className="flex flex-col items-center gap-14 md:gap-20 relative z-10 w-full px-2 md:px-8 pb-10">
                 
                 {/* Level 1: Suspects */}
                 <div id="group-suspects" className="hud-container p-6 md:p-8 w-full md:w-4/5 min-h-[140px]">
                   <div className="hud-corner hud-corner-tl"></div><div className="hud-corner hud-corner-tr"></div>
                   <div className="hud-corner hud-corner-bl"></div><div className="hud-corner hud-corner-br"></div>
                   <div className="text-center font-bold text-xl md:text-2xl mb-8 tracking-[0.3em]">
                     <span className="text-glow-red font-cyber border-b border-rose-500/50 inline-block pb-1">主 嫌 [ALPHA]</span>
                   </div>
                   <div className="flex flex-wrap gap-6 md:gap-10 justify-center">
                     {data.suspects.map(node => <NodeCard key={node.id} data={node} themeClass="node-red" />)}
                   </div>
                 </div>

                 {/* Level 2: Accomplices (條件渲染) */}
                 {data.showAccomplices && (
                   <div id="group-accomplices" className="hud-container p-6 md:p-8 w-full md:w-4/5 min-h-[140px]">
                     <div className="hud-corner hud-corner-tl"></div><div className="hud-corner hud-corner-tr"></div>
                     <div className="hud-corner hud-corner-bl"></div><div className="hud-corner hud-corner-br"></div>
                     <div className="text-center font-bold text-xl md:text-2xl mb-8 tracking-[0.3em]">
                       <span className="text-glow-yellow font-cyber border-b border-amber-500/50 inline-block pb-1">共 犯 [BETA]</span>
                     </div>
                     <div className="flex flex-wrap gap-6 md:gap-10 justify-center">
                       {data.accomplices.map(node => <NodeCard key={node.id} data={node} themeClass="node-yellow" />)}
                     </div>
                   </div>
                 )}

                 {/* Level 3: Third Group (條件渲染) */}
                 {data.showThirdGroup && (
                   <div id="group-third" className="hud-container p-6 md:p-8 w-full md:w-4/5 min-h-[140px]">
                     <div className="hud-corner hud-corner-tl"></div><div className="hud-corner hud-corner-tr"></div>
                     <div className="hud-corner hud-corner-bl"></div><div className="hud-corner hud-corner-br"></div>
                     <div className="text-center font-bold text-xl md:text-2xl mb-8 tracking-[0.3em]">
                       <span className="text-glow-blue font-cyber border-b border-cyan-500/50 inline-block pb-1 uppercase">{data.thirdGroupName || 'UNKNOWN'} [GAMMA]</span>
                     </div>
                     <div className="flex flex-wrap gap-6 md:gap-10 justify-center">
                       {data.thirdGroup.map(node => <NodeCard key={node.id} data={node} themeClass="node-blue" />)}
                     </div>
                   </div>
                 )}

              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
